name: TPOT2 Conformance

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tpot2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  tpot2-conformance:
    name: TPOT2 exact-head surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-04-15 --profile minimal

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tpot2-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: tpot2-${{ runner.os }}-

      - name: Execute bounded TPOT2 surfaces
        id: surfaces
        run: |
          set +e

          cargo +nightly-2026-04-15 test --test test_tpot2_pipeline \
            2>&1 | tee "${RUNNER_TEMP}/tpot2-rust-pipeline.log"
          rust_rc=${PIPESTATUS[0]}

          cargo +nightly-2026-04-15 test -p lsp-max-protocol pipeline \
            2>&1 | tee "${RUNNER_TEMP}/tpot2-protocol-pipeline.log"
          protocol_rc=${PIPESTATUS[0]}

          bash tests/test_tpot2_e2e.sh \
            2>&1 | tee "${RUNNER_TEMP}/tpot2-e2e.log"
          e2e_rc=${PIPESTATUS[0]}

          {
            echo "rust_rc=${rust_rc}"
            echo "protocol_rc=${protocol_rc}"
            echo "e2e_rc=${e2e_rc}"
          } >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload TPOT2 execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpot2-execution-logs
          path: ${{ runner.temp }}/tpot2-*.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce TPOT2 standing
        env:
          RUST_RC: ${{ steps.surfaces.outputs.rust_rc }}
          PROTOCOL_RC: ${{ steps.surfaces.outputs.protocol_rc }}
          E2E_RC: ${{ steps.surfaces.outputs.e2e_rc }}
        run: |
          set -euo pipefail

          status="ALIVE"
          if [[ "$RUST_RC" != "0" || "$PROTOCOL_RC" != "0" || "$E2E_RC" != "0" ]]; then
            status="BLOCKED"
          fi

          {
            echo "## TPOT2 Conformance"
            echo
            echo "Exact-head standing: **${status}**"
            echo
            echo "| Surface | Exit |"
            echo "| --- | ---: |"
            echo "| Rust pipeline | ${RUST_RC} |"
            echo "| Protocol pipeline | ${PROTOCOL_RC} |"
            echo "| E2E transcript | ${E2E_RC} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" != "ALIVE" ]]; then
            echo "::error::TPOT2 requires all three execution surfaces to exit 0"
            exit 1
          fi
