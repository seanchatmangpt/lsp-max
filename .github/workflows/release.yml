name: Release Candidate Validation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate tagged source without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record exact source identity
        run: |
          git rev-parse HEAD
          git describe --tags --exact-match HEAD

      - name: Install validation toolchain and scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install nightly-2026-04-15 \
            --profile minimal \
            --component clippy \
            --component rustfmt

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-candidate-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: release-candidate-${{ runner.os }}-

      - name: Verify repository invariants
        run: bash scripts/audit-repository.sh

      - name: Verify formatting
        run: cargo +nightly-2026-04-15 fmt --all -- --check

      - name: Execute strict Clippy
        run: cargo +nightly-2026-04-15 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Execute workspace tests
        run: cargo +nightly-2026-04-15 test --workspace --all-targets

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +nightly-2026-04-15 doc --workspace --no-deps --all-features

      - name: Verify root package
        run: cargo +nightly-2026-04-15 publish -p lsp-max --dry-run --allow-dirty

      - name: Build release profile
        run: cargo +nightly-2026-04-15 build --release --workspace

      - name: Refuse automated publication
        run: |
          echo "REFUSED: this workflow validates tagged source only."
          echo "Crates.io publication and GitHub release creation require separate human authority."
