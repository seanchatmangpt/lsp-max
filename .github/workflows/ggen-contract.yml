# @generated by ggen from packs/lsp-max-runtime-pack/ontology.ttl.
name: ggen contract

on:
  pull_request:
    paths:
      - 'ggen.toml'
      - 'packs/lsp-max-runtime-pack/**'
      - 'docs/generated/**'
      - 'evidence/generated/**'
      - 'tests/ggen_law_contract.rs'
      - 'tests/fixtures/ggen/**'
      - 'scripts/verify-ggen-contract.py'
      - '.github/workflows/ggen-contract.yml'
      - 'AGENTS.md'
      - 'Justfile'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  GGEN_VERSION: '26.7.62'
  GGEN_COMMIT: '68952593c40214ac1a681073d65f3902a9cdfce4'

jobs:
  semantic-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install independent verifier dependencies
        run: python -m pip install --disable-pip-version-check 'rdflib==7.1.4' 'blake3==1.0.5'

      - name: Admit graph and execute negative falsifiers
        run: |
          python scripts/verify-ggen-contract.py --check --negative-fixtures \
            --emit-receipt target/ggen/verification-receipt.json

      - name: Replay the observed receipt
        run: python scripts/verify-ggen-contract.py --replay target/ggen/verification-receipt.json

      - name: Upload execution receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: lsp-max-ggen-verification-receipt
          path: target/ggen/verification-receipt.json
          if-no-files-found: error
          retention-days: 30

  generated-rust-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b72f698fdd19549f0f0fb45cf08

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: '1.82.0'

      - name: Execute generated Rust contract
        run: cargo test --test ggen_law_contract

  deterministic-ggen-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Checkout pinned ggen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.GGEN_COMMIT }}
          path: ggen-tool
          fetch-depth: 1

      - name: Provision exact sibling graph
        shell: bash
        run: |
          set -euo pipefail
          repos=(lsp-max lsp-types-max wasm4pm wasm4pm-compat)
          shas=(7bcc1e16dec71ef5fb2cedea2dfd6cb5cde37f59 6773e6017ca83c565785d0ec39d75304f62c3237 0bb134b29245517ac4969a9f1916f5432931c5d0 e46155e209a750fda0218532d96ae17a9e10903e)
          for i in "${!repos[@]}"; do
            git init -q "${repos[$i]}"
            git -C "${repos[$i]}" remote add origin "https://github.com/seanchatmangpt/${repos[$i]}"
            git -C "${repos[$i]}" fetch -q --depth 1 origin "${shas[$i]}"
            git -C "${repos[$i]}" checkout -q FETCH_HEAD
          done

      - name: Install pinned ggen toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt,clippy

      - name: Install ggen build prerequisites
        uses: taiki-e/install-action@81ecf985428d5c2ea81dbf079bceca32bc9604ab
        with:
          tool: sccache

      - name: Build the exact ggen CLI
        run: cargo build --manifest-path ggen-tool/Cargo.toml -p ggen-cli-lib --bin ggen

      - name: Manufacture all governed surfaces
        run: ./ggen-tool/target/debug/ggen sync run

      - name: Verify ggen receipt chain
        run: ./ggen-tool/target/debug/ggen receipt verify

      - name: Refuse generated drift
        run: |
          git diff --exit-code -- \
            docs/generated/GGEN_MANUFACTURING_CONTRACT.md \
            docs/generated/STANDING_MODEL.md \
            docs/generated/GALL_ROADMAP.md \
            evidence/generated/verification-manifest.json \
            tests/ggen_law_contract.rs \
            .github/workflows/ggen-contract.yml
