name: One-shot rustdoc link repair

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: one-shot-rustdoc-links-pr-22
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wasm4pm-lsp-example-crates-io-dep
          fetch-depth: 0

      - name: Record admitted source
        run: git rev-parse HEAD

      - name: Replace the exact invalid intra-doc link set
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "[`LogGroundedFitnessEvaluator`]": ("`LogGroundedFitnessEvaluator`", 1),
              "[`LogProfile`]": ("`LogProfile`", 2),
              "[`read_ocel_log`]": ("`read_ocel_log`", 1),
              "[`ACTIVITY_CAP`]": ("`ACTIVITY_CAP`", 1),
              "[`OBJECT_TYPE_CAP`]": ("`OBJECT_TYPE_CAP`", 1),
              "[`Prng`]": ("`Prng`", 1),
              "[`PipelineBoundedStatus::Refused`]": ("`PipelineBoundedStatus::Refused`", 2),
              "[`PipelineBoundedStatus::Admitted`]": ("`PipelineBoundedStatus::Admitted`", 1),
              "[`PipelineBoundedStatus::Partial`]": ("`PipelineBoundedStatus::Partial`", 1),
              "[`PipelineBoundedStatus::Unknown`]": ("`PipelineBoundedStatus::Unknown`", 2),
          }

          files = list(Path("src").rglob("*.rs"))
          observed = {key: 0 for key in replacements}
          for path in files:
              text = path.read_text()
              changed = False
              for old, (new, _) in replacements.items():
                  count = text.count(old)
                  if count:
                      observed[old] += count
                      text = text.replace(old, new)
                      changed = True
              if changed:
                  path.write_text(text)

          wrong = {
              key: {"expected": expected, "observed": observed[key]}
              for key, (_, expected) in replacements.items()
              if observed[key] != expected
          }
          if wrong:
              raise SystemExit(f"REFUSED: rustdoc link occurrence mismatch: {wrong}")
          if sum(observed.values()) != 13:
              raise SystemExit(f"REFUSED: expected 13 replacements, observed {sum(observed.values())}")
          PY

      - name: Verify strict documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          rustup toolchain install nightly-2026-04-15 --profile minimal
          cargo +nightly-2026-04-15 doc --workspace --no-deps --all-features

      - name: Remove one-shot authority and enforce bounded diff
        run: |
          git rm .github/workflows/one-shot-rustdoc-links.yml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/one-shot-rustdoc-links.yml|src/pipeline/*.rs) ;;
              *) echo "REFUSED: unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit repair and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pipeline
          git commit -m "docs(rustdoc): repair strict intra-doc links"
          git push origin HEAD:fix/wasm4pm-lsp-example-crates-io-dep
