name: lsp-max Conformance Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance Score
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install scanner and pinned Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install nightly-2026-04-15 --profile minimal

      - name: Run authoritative law compliance scanner
        run: bash scripts/check-law-compliance.sh

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: conformance-${{ runner.os }}-

      - name: Build lsp-max runtime and targets
        run: cargo +nightly-2026-04-15 build -p lsp-max --all-targets

      - name: Scan and enforce ontology law-axis consistency
        run: |
          set -euo pipefail

          ontology="ontology/lsp318.ttl"

          status_count() {
            { rg -o "law:status[[:space:]]+law:$1" "$ontology" || true; } | wc -l | tr -d ' '
          }

          METHODS="$({ rg -o 'lsp:methodName[[:space:]]+"[^"]+"' "$ontology" || true; } | wc -l | tr -d ' ')"
          ADMITTED="$(status_count ADMITTED)"
          CANDIDATE="$(status_count CANDIDATE)"
          REFUSED="$(status_count REFUSED)"
          UNKNOWN="$(status_count UNKNOWN)"
          BLOCKED="$(status_count BLOCKED)"
          PARTIAL="$(status_count PARTIAL)"
          OPEN="$(status_count OPEN)"
          STATUS_TOTAL=$((ADMITTED + CANDIDATE + REFUSED + UNKNOWN + BLOCKED + PARTIAL + OPEN))
          NON_ADMITTED=$((STATUS_TOTAL - ADMITTED))

          if [[ "$METHODS" -eq 0 ]]; then
            echo "::error::No LSP method declarations were observed"
            exit 1
          fi

          if [[ "$STATUS_TOTAL" -ne "$METHODS" ]]; then
            echo "::error::Every declared LSP method must have exactly one law:status assignment: methods=$METHODS statuses=$STATUS_TOTAL"
            exit 1
          fi

          if [[ "$NON_ADMITTED" -eq 0 ]]; then
            STANDING="ALIVE"
          else
            STANDING="PARTIAL_ALIVE"
          fi

          {
            echo "## lsp-max Conformance Status"
            echo
            echo "Exact ontology standing: **${STANDING}**"
            echo
            echo "| Law status | Assigned methods |"
            echo "| --- | ---: |"
            echo "| ADMITTED | $ADMITTED |"
            echo "| CANDIDATE | $CANDIDATE |"
            echo "| REFUSED | $REFUSED |"
            echo "| UNKNOWN | $UNKNOWN |"
            echo "| BLOCKED | $BLOCKED |"
            echo "| PARTIAL | $PARTIAL |"
            echo "| OPEN | $OPEN |"
            echo "| **Total status assignments** | **$STATUS_TOTAL** |"
            echo "| **Declared methods** | **$METHODS** |"
            echo
            echo "REFUSED is a lawful negative state and does not by itself fail ontology consistency."
          } >> "$GITHUB_STEP_SUMMARY"
