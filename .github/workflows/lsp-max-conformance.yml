name: lsp-max Conformance Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance Score
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install scanner and pinned Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install nightly-2026-04-15 --profile minimal

      - name: Run authoritative law compliance scanner
        run: bash scripts/check-law-compliance.sh

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: conformance-${{ runner.os }}-

      - name: Build lsp-max runtime and targets
        run: cargo +nightly-2026-04-15 build -p lsp-max --all-targets

      - name: Scan and enforce ontology law-axis status
        run: |
          count() {
            rg -o "$1" ontology 2>/dev/null | wc -l | tr -d ' '
          }

          ADMITTED="$(count 'law:ADMITTED')"
          CANDIDATE="$(count 'law:CANDIDATE')"
          REFUSED="$(count 'law:REFUSED')"
          UNKNOWN="$(count 'law:UNKNOWN')"
          METHODS="$(count 'lsp:methodName')"

          {
            echo "## lsp-max Conformance Status"
            echo
            echo "| Axis | Count |"
            echo "|------|-------|"
            echo "| ADMITTED | $ADMITTED |"
            echo "| CANDIDATE | $CANDIDATE |"
            echo "| REFUSED | $REFUSED |"
            echo "| UNKNOWN | $UNKNOWN |"
            echo "| Total methods declared | $METHODS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$METHODS" -eq 0 ]]; then
            echo "::error::No LSP method declarations were observed"
            exit 1
          fi

          if [[ "$REFUSED" -gt 0 ]]; then
            echo "::error::$REFUSED refused ontology entries block conformance"
            exit 1
          fi
