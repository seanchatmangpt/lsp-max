name: lsp-max Conformance Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance Score
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install scanner and pinned Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install nightly-2026-04-15 --profile minimal

      - name: Run authoritative law compliance scanner
        run: bash scripts/check-law-compliance.sh

      - name: Verify protocol court projection
        run: python3 scripts/protocol-court.py --check

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: conformance-${{ runner.os }}-

      - name: Build lsp-max runtime and targets
        run: cargo +nightly-2026-04-15 build -p lsp-max --all-targets

      - name: Scan and enforce ontology law-axis consistency
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ontology = Path("ontology/lsp318.ttl")
          text = ontology.read_text()
          statuses = (
              "ADMITTED",
              "CANDIDATE",
              "REFUSED",
              "UNKNOWN",
              "BLOCKED",
              "PARTIAL",
              "OPEN",
          )

          methods = re.findall(r'lsp:methodName\s+"[^"]+"', text)
          counts = {
              status: len(re.findall(rf"law:status\s+law:{status}\b", text))
              for status in statuses
          }
          method_count = len(methods)
          status_total = sum(counts.values())

          if method_count == 0:
              raise SystemExit("REFUSED: no LSP method declarations were observed")
          if status_total != method_count:
              raise SystemExit(
                  "REFUSED: every declared LSP method must have exactly one "
                  f"law:status assignment: methods={method_count} statuses={status_total}"
              )

          standing = "ALIVE" if counts["ADMITTED"] == status_total else "PARTIAL_ALIVE"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as out:
              out.write("## lsp-max Conformance Status\n\n")
              out.write(f"Exact ontology standing: **{standing}**\n\n")
              out.write("| Law status | Assigned methods |\n")
              out.write("| --- | ---: |\n")
              for status in statuses:
                  out.write(f"| {status} | {counts[status]} |\n")
              out.write(f"| **Total status assignments** | **{status_total}** |\n")
              out.write(f"| **Declared methods** | **{method_count}** |\n\n")
              out.write(
                  "REFUSED is a lawful negative state and does not by itself "
                  "fail ontology consistency.\n"
              )
          PY
