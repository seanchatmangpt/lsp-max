name: One-shot Rust repair

on:
  push:
    branches: [audit/lsp-max-80-20]

permissions:
  contents: write

concurrency:
  group: one-shot-rust-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/lsp-max-80-20
          fetch-depth: 0

      - name: Record admitted source
        run: git rev-parse HEAD

      - name: Apply exact mechanical repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/runtime/sha256.rs"): [
                  (
                      "while (padded.len() + 8) % 64 != 0 {",
                      "while !(padded.len() + 8).is_multiple_of(64) {",
                      1,
                  ),
              ],
              Path("src/lib.rs"): [
                  (
                      "(year % 4 == 0 && year % 100 != 0) || (year % 400 == 0)",
                      "(year.is_multiple_of(4) && !year.is_multiple_of(100))\n            || year.is_multiple_of(400)",
                      2,
                  ),
                  (
                      "while (padded.len() + 8) % 64 != 0 {",
                      "while !(padded.len() + 8).is_multiple_of(64) {",
                      1,
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new, expected in edits:
                  observed = text.count(old)
                  if observed != expected:
                      raise SystemExit(
                          f"REFUSED: {path}: expected {expected} occurrences of {old!r}, observed {observed}"
                      )
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Format with pinned toolchain
        run: |
          rustup toolchain install nightly-2026-04-15 --profile minimal --component rustfmt
          cargo +nightly-2026-04-15 fmt --all

      - name: Enforce bounded diff
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/lib.rs\nsrc/runtime/sha256.rs'

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs src/runtime/sha256.rs
          git commit -m "style(rust): satisfy pinned strict Clippy arithmetic lints"
          git push origin HEAD:audit/lsp-max-80-20
