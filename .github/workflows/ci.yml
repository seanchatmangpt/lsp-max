name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  result:
    name: CI Result
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install pinned Rust documentation toolchain
        run: rustup toolchain install nightly-2026-04-15 --profile minimal

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docs-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: docs-${{ runner.os }}-

      - name: Build workspace documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +nightly-2026-04-15 doc --workspace --no-deps --all-features

      - name: Execute workspace doctests
        run: cargo +nightly-2026-04-15 test --workspace --doc
