name: lsp-max Law Compliance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: law-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  law-check:
    name: Law Compliance Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run law compliance scanner
        run: |
          bash scripts/check-law-compliance.sh
          {
            echo "## Law Compliance Report"
            echo "Scanner: scripts/check-law-compliance.sh"
            echo "Status: ALIVE for the exact checked-out subject"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate ontology, query, and template projections
        run: |
          required=(
            ontology/lsp318.ttl
            ontology/law-axes.ttl
            ontology/max-protocol.ttl
          )

          for file in "${required[@]}"; do
            [[ -s "$file" ]] || {
              echo "::error::Required ontology projection missing or empty: $file"
              exit 1
            }
          done

          QUERY_COUNT="$(find queries/lsp-max -type f -name '*.sparql' -print | wc -l | tr -d ' ')"
          TEMPLATE_COUNT="$(find templates/lsp-max -type f -name '*.tera' -print | wc -l | tr -d ' ')"

          {
            echo "## Projection Inventory"
            echo "- SPARQL queries: $QUERY_COUNT"
            echo "- Tera templates: $TEMPLATE_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$QUERY_COUNT" -gt 0 ]] || {
            echo "::error::No SPARQL query projections observed"
            exit 1
          }
          [[ "$TEMPLATE_COUNT" -gt 0 ]] || {
            echo "::error::No Tera template projections observed"
            exit 1
          }

  library-tests:
    name: Library Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-04-15 --profile minimal

      - name: Cache Cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: law-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: law-${{ runner.os }}-

      - name: Execute lsp-max library tests
        run: cargo +nightly-2026-04-15 test -p lsp-max --lib
