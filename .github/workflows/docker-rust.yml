name: Rust Docker Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-rust:
    name: cargo build --workspace --all-targets (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Docker engine identity
        run: docker version

      - name: Build Rust workspace in clean container
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          docker build \
            --progress=plain \
            --file Dockerfile.ci \
            --tag "lsp-max-rust:${SOURCE_SHA}" \
            .
