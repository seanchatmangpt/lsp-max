name: Rust Docker Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.ci'
      - '.github/workflows/docker-rust.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.ci'
      - '.github/workflows/docker-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-rust:
    name: cargo build --workspace --all-targets (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source identity
        run: git rev-parse HEAD

      - name: Docker engine identity
        run: docker version

      # Plain `docker build` (docker-daemon builder). The buildx container
      # driver + gha cache (tried in 1f6f9bc) tripled cold-build time:
      # identical source built in ~13m pre-change and timed out at the 30m
      # job limit twice (runs 41910954115, 41923142188). Do not reintroduce
      # setup-buildx-action/build-push-action here without re-baselining
      # build duration on a live run.
      - name: Build Rust workspace in clean container
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          docker build \
            --progress=plain \
            --file Dockerfile.ci \
            --tag "lsp-max-rust:${SOURCE_SHA}" \
            .
