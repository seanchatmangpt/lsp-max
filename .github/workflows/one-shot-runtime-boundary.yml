name: One-shot runtime boundary repair

on:
  push:
    branches: [audit/lsp-max-80-20]

permissions:
  contents: write

concurrency:
  group: one-shot-runtime-boundary
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/lsp-max-80-20
          fetch-depth: 0

      - name: Record admitted source
        run: git rev-parse HEAD

      - name: Apply exact bounded repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          codec = Path("src/codec.rs")
          text = codec.read_text()
          replacements = [
              (
                  '#[cfg(all(feature = "runtime-agnostic", not(feature = "runtime-tokio")))]\nuse async_codec_lite::{Decoder, Encoder};\n',
                  '',
                  1,
              ),
              (
                  '''#[cfg(all(feature = "runtime-agnostic", not(feature = "runtime-tokio")))]
impl<T: Serialize> Encoder for LanguageServerCodec<T> {
    type Item = T;
    type Error = ParseError;

    fn encode(&mut self, item: Self::Item, dst: &mut BytesMut) -> Result<(), Self::Error> {
        let msg = serde_json::to_string(&item).unwrap_or_default();
        trace!("-> {}", msg);
        lsp_max_protocol::base_protocol::encode_message(item, dst)
    }
}

''',
                  '',
                  1,
              ),
              (
                  '    #[cfg(all(feature = "runtime-agnostic", not(feature = "runtime-tokio")))]\n    use async_codec_lite::{Decoder, Encoder};\n',
                  '',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f"REFUSED: {codec}: expected {expected} occurrences, observed {observed}: {old!r}"
                  )
              text = text.replace(old, new)
          codec.write_text(text)

          scaffold = Path("examples/lsp-max-scaffold/src/verifiable.rs")
          text = scaffold.read_text()
          old = "if s.len() % 2 != 0 {"
          new = "if !s.len().is_multiple_of(2) {"
          observed = text.count(old)
          if observed != 1:
              raise SystemExit(
                  f"REFUSED: {scaffold}: expected 1 occurrence of {old!r}, observed {observed}"
              )
          scaffold.write_text(text.replace(old, new))
          PY

      - name: Format with pinned toolchain
        run: |
          rustup toolchain install nightly-2026-04-15 --profile minimal --component rustfmt
          cargo +nightly-2026-04-15 fmt --all

      - name: Enforce bounded diff
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'examples/lsp-max-scaffold/src/verifiable.rs\nsrc/codec.rs'

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/lsp-max-scaffold/src/verifiable.rs src/codec.rs
          git commit -m "fix(runtime): remove dead codec feature path and satisfy Clippy"
          git push origin HEAD:audit/lsp-max-80-20
